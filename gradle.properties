# --- Gradle daemon / build performance -----------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21

# --- Kotlin ---------------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# --- Android --------------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 turns on built-in Kotlin by default; we intentionally keep the explicit KGP path so
# KSP/Hilt/Compose-compiler all bind to the single Kotlin version pinned in the catalog.
# (Removal of this opt-out is scheduled for AGP 10 — see README > Toolchain migration.)
android.builtInKotlin=false
android.newDsl=false
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true
