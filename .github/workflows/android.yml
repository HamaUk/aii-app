name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # JDK 17 is the minimum for AGP 9.x and Gradle 9.x.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ---------------------------------------------------------------------------------------
      # Unit tests: the whole agent harness, all four protocol adapters, the SSE/frame parsers,
      # the thought processor and the markdown block parser run on the JVM, so a failure here
      # points at logic rather than at an emulator. 55 tests, no device required.
      # ---------------------------------------------------------------------------------------
      - name: Run unit tests
        run: ./gradlew :core:common:test :core:model:test :core:ai:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # ---------------------------------------------------------------------------------------
      # Release build: R8 + resource shrinking. Run on every push because shrinking is where
      # reflective breakage (Kotlinx serialization, Room, Hilt) shows up.
      # ---------------------------------------------------------------------------------------
      - name: Provision a signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-release.jks" >> "$GITHUB_ENV"
            echo "NEXUS_KEYSTORE_PASSWORD=${{ secrets.NEXUS_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "NEXUS_KEY_ALIAS=${{ secrets.NEXUS_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "NEXUS_KEY_PASSWORD=${{ secrets.NEXUS_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            # Forks and PRs: generate an ephemeral key so the release pipeline is still exercised.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/nexus-ci.jks" -storepass nexusci \
              -keypass nexusci -alias nexusci -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Nexus CI, OU=Automation, O=Nexus, L=London, C=GB" > /dev/null
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-ci.jks" >> "$GITHUB_ENV"
            echo "NEXUS_KEYSTORE_PASSWORD=nexusci" >> "$GITHUB_ENV"
            echo "NEXUS_KEY_ALIAS=nexusci" >> "$GITHUB_ENV"
            echo "NEXUS_KEY_PASSWORD=nexusci" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
