####################################################################################################
#  Nexus Agent — Gradle Version Catalog
#  Toolchain matrix verified against Google Maven / Maven Central on 2026-09-22.
#
#  Why these exact pins (read before bumping):
#   * AGP 9.x has *built-in Kotlin* enabled by default, and applying `org.jetbrains.kotlin.android`
#     while it is on is a hard build failure. We deliberately run AGP on the legacy (explicit KGP)
#     path via `android.builtInKotlin=false` so that KSP + Hilt + the Compose compiler plugin all
#     resolve against ONE Kotlin version we control (2.3.20). Migrate to built-in Kotlin when you
#     move to AGP 10, which removes the opt-out (https://kotl.in/gradle/agp-built-in-kotlin).
#   * KSP moved to independent versioning: the 2.3.x line is built against Kotlin 2.3.20 stdlib,
#     which is why `kotlin = "2.3.20"` and `ksp = "2.3.12"` are pinned together. Do not bump one
#     without the other.
#   * Compose BOM 2026.09.00 -> Compose 1.12.x, which requires compileSdk 37.
####################################################################################################
[versions]
agp                     = "9.4.1"
kotlin                  = "2.3.20"
ksp                     = "2.3.12"

compileSdk              = "37"
minSdk                  = "26"
targetSdk               = "37"

# --- AndroidX core / lifecycle / navigation -----------------------------------------------
coreKtx                 = "1.19.0"
activityCompose         = "1.13.0"
lifecycle               = "2.11.0"
navigationCompose       = "2.10.1"
splashscreen            = "1.2.0"
documentfile            = "1.1.0"
profileinstaller        = "1.4.1"
appcompat               = "1.8.0"

# --- Compose ------------------------------------------------------------------------------
composeBom              = "2026.09.00"
materialIconsExtended   = "1.7.8"     # frozen line; matches the BOM's material-icons-core
adaptiveNav3            = "1.3.0"

# --- DI -----------------------------------------------------------------------------------
hilt                    = "2.60.1"
androidxHilt            = "1.4.0"

# --- Persistence --------------------------------------------------------------------------
room                    = "2.8.5"
datastore               = "1.2.1"
securityCrypto          = "1.1.0"

# --- Networking / serialization -----------------------------------------------------------
ktor                    = "3.6.0"
okhttp                  = "5.2.1"
serialization           = "1.11.0"
coroutines              = "1.11.0"
okio                    = "3.18.2"

# --- Tooling / content parsing ------------------------------------------------------------
jsoup                   = "1.23.2"
pdfboxAndroid           = "2.0.27.0"
coil                    = "3.6.3"

# --- Test ---------------------------------------------------------------------------------
junit                   = "4.13.2"
androidxTestJunit       = "1.3.0"
espresso                = "3.7.0"
turbine                 = "1.2.1"
mockk                   = "1.14.11"
coroutinesTest          = "1.11.0"

[libraries]
# AndroidX core
androidx-core-ktx               = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat              = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen      = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-documentfile           = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-profileinstaller       = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose     = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Compose
androidx-compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text            = { group = "androidx.compose.ui", name = "ui-text" }
androidx-compose-ui-util            = { group = "androidx.compose.ui", name = "ui-util" }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation         = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-foundation-layout  = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-compose-animation          = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics" }
androidx-compose-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "adaptiveNav3" }

# DI
hilt-core                    = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-android                    = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

# Persistence
room-runtime                    = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                        = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler                   = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences  = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto        = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Networking
ktor-client-core                = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp              = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging             = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock                = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp                          = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging                  = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
okio                            = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# Content / parsing / media
jsoup                           = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
pdfbox-android                  = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
coil-compose                    = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp             = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Test
junit                           = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit             = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso          = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlin-test                     = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine                         = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk                           = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm               = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application      = { id = "com.android.application", version.ref = "agp" }
android-library          = { id = "com.android.library", version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                     = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
